name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked

      - name: Built CLI smoke test
        run: |
          # --help: usage on stdout, exit 0
          ./target/debug/s1m --help | grep -q "Usage:"

          # no args: usage on stderr, exit 2 — the query and entry files are missing
          code=0
          stderr="$(./target/debug/s1m 2>&1 >/dev/null)" || code=$?
          test "$code" -eq 2
          echo "$stderr" | grep -q "Usage:"

          # unknown flag: exit 2
          code=0
          ./target/debug/s1m --bogus >/dev/null 2>&1 || code=$?
          test "$code" -eq 2
