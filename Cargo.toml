[package]
name = "s1m"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Finds the parts of a markdown knowledge base relevant to a query by walking its links."
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
