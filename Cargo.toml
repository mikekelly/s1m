[package]
name = "s1m"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.85"
description = "Reads local markdown files and ranks them for a query, so an agent opens only what matters."
license = "MIT"
repository = "https://github.com/mikekelly/s1m"
publish = false

# `publish = false` hides the binary from `dist`, which releases it as prebuilt
# archives and a shell installer instead (#81); which binaries those archives
# carry is in dist-workspace.toml.
[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
