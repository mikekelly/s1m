[package]
name = "s1m"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reads local markdown files and ranks them for a query, so an agent opens only what matters."
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
clap = { version = "4", features = ["derive"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
ignore = "0.4.30"
pulldown-cmark = { version = "0.13.4", default-features = false }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
