[package]
name = "s1m"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Finds the parts of a markdown knowledge base relevant to a query by walking its links."
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
